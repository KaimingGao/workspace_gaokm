[project]
name = "quantlab"
version = "0.1.0"
description = "量化交易系统（融合 AI）"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data", "docs", ".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names, etc.)
    "I",     # isort (import ordering)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common gotchas)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "E203",   # whitespace before ':' (black-compatible)
    "E402",   # module import not at top (legacy lazy / logger placement debt)
    "E731",   # lambda assignment (occasional local helpers)
    "E741",   # ambiguous variable name
    "B007",   # unused loop control variable
    "B008",   # function call in default argument (common in FastAPI)
    "B905",   # zip without strict= (py310+ progressive)
    "SIM102", # collapsible-if (readability tradeoff)
    "SIM105", # contextlib.suppress preference
    "SIM108", # ternary instead of if-else (readability)
    "SIM110", # any/all rewrites
    "SIM118", # key in dict.keys()
    "SIM109", # multiple equality comparisons
    "SIM103", # return condition directly
    "SIM115", # open file with context handler
    "SIM210", # if expr with True/False
    "B904",   # raise from inside except
    "C401",   # set comprehension style
    "C408",   # unnecessary collection call
    "C414",   # unnecessary double cast
    "C416",   # unnecessary comprehension
    "W293",   # blank line with whitespace
    "UP031",  # printf → f-string (large churn)
    "F841",   # unused local (noisy across research paths)
    # 渐进式现代化：全仓 Dict/Optional 债极大，先不挡 CI
    "UP006",
    "UP045",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"main.py" = ["E402"]
"run_web.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["core", "quant", "agent", "services", "skills", "web", "research"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["data/", "docs/", ".venv/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-x -q"
