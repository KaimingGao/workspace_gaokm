<div class="dashboard-head quant-head">
  <div class="dashboard-head-text quant-head-text">
    <p class="dashboard-eyebrow">Paper Desk</p>
    <h2>纸面进阶</h2>
    <p id="paper-meta" class="dashboard-meta quant-meta" aria-live="polite">假账初始化 / 高级配置 · 日常请用交易执行</p>
  </div>
</div>

<div class="quant-body paper-page">
  <div id="paper-empty" class="watching-empty" hidden>
    <p class="watching-empty-text">尚未创建纸面账户。初始化后可同步观察名单，并在「模拟」买卖。</p>
    <button type="button" id="paper-init" class="dialog-btn">初始化</button>
  </div>

  <div id="paper-main" class="paper-main">
    <div class="paper-stats paper-stats-compact" id="paper-stats"></div>

    <section class="dashboard-section">
      <header class="dashboard-section-head">
        <h3 class="dashboard-section-title">规则</h3>
        <p class="dashboard-section-desc">当前纸面规则摘要</p>
      </header>
      <div class="dashboard-card paper-section-card paper-rules-card">
        <div id="paper-rules-summary" class="paper-rules-chips">—</div>
      </div>
    </section>
  </div>
</div>
