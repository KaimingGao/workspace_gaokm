<div class="dashboard-head quant-head">
  <div class="dashboard-head-text quant-head-text">
    <p class="dashboard-eyebrow">Platform Desk</p>
    <h2>平台</h2>
    <p id="platform-meta" class="dashboard-meta quant-meta" aria-live="polite">调度 · 日更</p>
    <p class="dashboard-section-desc platform-head-path">
      <a class="platform-hero-link" href="#platform-schedule-section">日更</a>
      →
      <a class="platform-hero-link" href="/follow">交易执行</a>
      ·
      <a class="platform-hero-link" href="/strategy">策略</a>
    </p>
  </div>
  <div class="dashboard-head-actions quant-head-actions platform-head-actions">
    <span class="quant-desk-badge platform-desk-badge" title="调度纸面日更">调度 · 日更</span>
    <span class="platform-desk-guard" title="不接 OMS；日更默认不模拟买入">不代客下单</span>
  </div>
</div>

<div class="quant-body platform-page">
  <section
    class="dashboard-section quant-section platform-section platform-overview-section"
    id="platform-section-overview"
    aria-labelledby="platform-section-overview-title"
  >
    <header class="dashboard-section-head quant-section-head platform-section-head">
      <h3 id="platform-section-overview-title" class="dashboard-section-title">概览</h3>
      <p class="dashboard-section-desc quant-section-desc">上次调度 · 告警</p>
    </header>
    <div class="dashboard-overview-band quant-pro-desk-top platform-overview-band">
      <div class="dashboard-kpi-row quant-pro-overview-kpis platform-kpi-row" id="platform-kpi-row" aria-label="平台 KPI">
        <div class="dashboard-kpi-row-body">
          <div class="dashboard-kpi-card quant-pro-kpi-card platform-kpi-card is-empty" data-kpi="kind">
            <div class="dashboard-kpi-label quant-pro-kpi-label platform-kpi-label">上次调度</div>
            <div class="dashboard-kpi-value quant-pro-kpi-value platform-kpi-value" id="platform-kpi-kind">—</div>
            <div class="dashboard-kpi-sub quant-pro-kpi-sub platform-kpi-sub" id="platform-kpi-kind-sub">共用 last-run</div>
          </div>
          <div class="dashboard-kpi-card quant-pro-kpi-card platform-kpi-card is-empty" data-kpi="when">
            <div class="dashboard-kpi-label quant-pro-kpi-label platform-kpi-label">完成时间</div>
            <div class="dashboard-kpi-value quant-pro-kpi-value platform-kpi-value" id="platform-kpi-when">—</div>
            <div class="dashboard-kpi-sub quant-pro-kpi-sub platform-kpi-sub" id="platform-kpi-when-sub">上次完成</div>
          </div>
          <div class="dashboard-kpi-card quant-pro-kpi-card platform-kpi-card is-empty" data-kpi="alerts">
            <div class="dashboard-kpi-label quant-pro-kpi-label platform-kpi-label">监控告警</div>
            <div class="dashboard-kpi-value quant-pro-kpi-value platform-kpi-value" id="platform-kpi-alerts">—</div>
            <div class="dashboard-kpi-sub quant-pro-kpi-sub platform-kpi-sub">last-run 条数</div>
          </div>
        </div>
      </div>
      <nav class="quant-path-rail quant-pro-path-rail platform-path-rail" aria-label="平台主路径">
        <a class="quant-path-step quant-pro-path-step platform-path-step is-active" href="#platform-schedule-section" data-step="daily" aria-current="step">
          <span class="quant-pro-path-num">1</span> 日更
        </a>
        <span class="quant-path-sep quant-pro-path-sep" aria-hidden="true">/</span>
        <a class="quant-path-step quant-pro-path-step platform-path-step" href="/follow" data-step="follow">
          <span class="quant-pro-path-num">2</span> 交易执行
        </a>
      </nav>
    </div>
  </section>

  <section
    class="dashboard-section quant-section platform-section"
    id="platform-schedule-section"
    aria-labelledby="platform-schedule-title"
  >
    <header class="dashboard-section-head quant-section-head platform-section-head">
      <h3 id="platform-schedule-title" class="dashboard-section-title">纸面日更</h3>
      <p class="dashboard-section-desc quant-section-desc">paper_daily · 五问 · 衰减告警 · 默认同脚本</p>
      <div class="quant-actions-inline platform-section-toolbar">
        <button type="button" id="schedule-paper-run" class="dialog-btn">运行日更</button>
        <button type="button" id="schedule-last-refresh" class="dialog-btn secondary">刷新上次</button>
      </div>
    </header>
    <div class="dashboard-card quant-pro-card platform-ops-card">
      <div class="quant-pro-card-body platform-card-body">
        <div class="quant-control-band platform-control-band">
          <label class="platform-field platform-check" title="勾选后日循环内按规则模拟买入；默认只盯市">
            <input id="schedule-paper-buy" type="checkbox" />
            <span>日更时模拟买入</span>
          </label>
          <p class="platform-hint">
            与 <code>bash scripts/daily_paper.sh</code> / launchd 同一入口。预览框是共用 last-run，后跑的调度会盖掉。
          </p>
        </div>
        <ul id="schedule-alert-list" class="platform-list"></ul>
        <dl id="schedule-last-out" class="platform-kv"></dl>
      </div>
    </div>
  </section>
</div>
