name: quantlab-ci

on:
  push:
    paths:
      - "quantlab/**"
      - ".github/workflows/quantlab-ci.yml"
  pull_request:
    paths:
      - "quantlab/**"
      - ".github/workflows/quantlab-ci.yml"
  workflow_dispatch:
    inputs:
      with_agent:
        description: Run full Agent golden regression (needs DASHSCOPE_API_KEY secret)
        type: boolean
        default: false

defaults:
  run:
    working-directory: quantlab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quantlab/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install quality-gate tools
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python3 -m compileall -q -j 4 core agent quant web skills services research

      - name: Lint (ruff — bug/hygiene rules)
        run: ruff check core/ quant/ agent/ services/ skills/ web/ research/

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Quant import audit
        run: bash scripts/check_quant_imports.sh

      - name: Repro evals (offline)
        run: python3 evals/run_repro.py

      - name: Golden checklist (mock, offline)
        run: python3 evals/run_checklist.py --mock --presets

      - name: Preset check
        run: python3 evals/run_preset_check.py

      - name: Daily run script (eval mock)
        run: python3 research/daily_run.py --eval-mock

  agent-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.with_agent == true
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quantlab/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Agent golden regression
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python3 evals/run_agent_regression.py
