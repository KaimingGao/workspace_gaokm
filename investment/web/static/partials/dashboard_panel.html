<div class="dashboard-head">
  <div class="dashboard-head-text">
    <p class="dashboard-eyebrow">Portfolio Overview</p>
    <h2>仪表盘</h2>
    <p class="dashboard-meta" id="dashboard-meta">纸面组合 · 市场 · 风险 · 信号</p>
  </div>
  <div class="dashboard-head-actions">
    <span class="dashboard-updated" id="dashboard-updated" data-state="loading">加载中</span>
    <button type="button" class="dialog-btn secondary" id="dashboard-refresh">刷新</button>
  </div>
</div>

<div class="quant-body dashboard-page">

  <!-- ① 市场 + KPI（统一概览带） -->
  <section class="dashboard-section" aria-label="市场与核心指标">
    <header class="dashboard-section-head">
      <h3 class="dashboard-section-title">概览</h3>
      <p class="dashboard-section-desc">指数 · 持仓广度 · 纸面 KPI</p>
    </header>
    <div class="dashboard-overview-band">
      <div class="dashboard-market-row" aria-label="市场监控">
        <div class="dashboard-market-cards" id="dashboard-market-cards"></div>
      </div>
      <div class="dashboard-kpi-row" aria-label="核心指标">
        <div class="dashboard-kpi-row-body" id="dashboard-kpi-cards"></div>
      </div>
    </div>
  </section>

  <!-- ② 风险摘要 -->
  <section class="dashboard-section" aria-label="组合风险">
    <header class="dashboard-section-head">
      <h3 class="dashboard-section-title">风险</h3>
      <p class="dashboard-section-desc">摘要条 · 收益/波动补充指标</p>
    </header>
    <div class="dashboard-risk-row">
      <div class="dashboard-risk-strip" id="dashboard-risk-strip" aria-label="风险摘要条"></div>
      <div class="dashboard-risk-cards" id="dashboard-risk-cards"></div>
    </div>
  </section>

  <!-- ③ 主曲线：净值 -->
  <section class="dashboard-section" aria-label="净值">
    <header class="dashboard-section-head">
      <h3 class="dashboard-section-title">净值路径</h3>
      <p class="dashboard-section-desc">累计净值（起点 100）· 可选沪深300</p>
    </header>
    <div class="dashboard-card dashboard-nav-card">
      <div class="dashboard-card-head">
        <h3>累计净值</h3>
        <div class="dashboard-card-tools">
          <label class="dashboard-bench-toggle">
            <input type="checkbox" id="dashboard-benchmark-toggle" checked />
            对比沪深300
          </label>
          <div class="dashboard-range-tabs" id="dashboard-nav-range" role="tablist" aria-label="净值区间">
            <button type="button" data-range="30" class="is-active">30D</button>
            <button type="button" data-range="90">90D</button>
            <button type="button" data-range="ytd">YTD</button>
            <button type="button" data-range="all">ALL</button>
          </div>
        </div>
      </div>
      <div class="dashboard-chart-host dashboard-nav-chart-host" id="dashboard-nav-chart"></div>
      <div class="dashboard-nav-stats" id="dashboard-nav-stats"></div>
    </div>
  </section>

  <!-- ④ 副图：回撤 / VaR / 板块 -->
  <section class="dashboard-section" aria-label="风险分解">
    <header class="dashboard-section-head">
      <h3 class="dashboard-section-title">风险分解</h3>
      <p class="dashboard-section-desc">回撤路径 · 收益分布 · 持仓板块</p>
    </header>
    <div class="dashboard-secondary-row">
      <div class="dashboard-card dashboard-drawdown-card">
        <div class="dashboard-card-head">
          <h3>回撤</h3>
          <span class="dashboard-card-sub" id="dashboard-drawdown-stats">—</span>
        </div>
        <div class="dashboard-chart-host dashboard-drawdown-chart-host" id="dashboard-drawdown-chart"></div>
      </div>

      <div class="dashboard-card dashboard-var-card">
        <div class="dashboard-card-head">
          <h3>历史 VaR</h3>
          <span class="dashboard-card-sub" id="dashboard-var-stats">—</span>
        </div>
        <div class="dashboard-chart-host dashboard-var-chart-host" id="dashboard-var-chart"></div>
      </div>

      <div class="dashboard-card dashboard-sector-card">
        <div class="dashboard-card-head">
          <h3>板块热力</h3>
          <span class="dashboard-card-sub" id="dashboard-sector-sub">持仓行业</span>
        </div>
        <div class="dashboard-sector-grid" id="dashboard-sector-grid"></div>
        <div class="dashboard-sector-legend">
          <span class="legend-up">▲ 涨</span>
          <span class="legend-flat">— 平</span>
          <span class="legend-down">▼ 跌</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ⑤ 仓位与信号：2×2 主次 -->
  <section class="dashboard-section" aria-label="仓位与信号">
    <header class="dashboard-section-head">
      <h3 class="dashboard-section-title">仓位与信号</h3>
      <p class="dashboard-section-desc">配置 / 暴露 · 信号 / 策略</p>
    </header>
    <div class="dashboard-bottom-row">
      <div class="dashboard-card dashboard-allocation-card dashboard-bottom-primary">
        <div class="dashboard-card-head">
          <h3>资产配置</h3>
          <span class="dashboard-card-sub" id="dashboard-allocation-sub">板块市值</span>
        </div>
        <div class="dashboard-allocation-body">
          <div class="dashboard-allocation-chart" id="dashboard-allocation-chart"></div>
          <div class="dashboard-allocation-legend" id="dashboard-allocation-legend"></div>
        </div>
      </div>

      <div class="dashboard-card dashboard-exposure-card dashboard-bottom-primary">
        <div class="dashboard-card-head">
          <h3>板块暴露</h3>
          <span class="dashboard-card-sub" id="dashboard-exposure-concentration">—</span>
        </div>
        <div class="dashboard-exposure-body" id="dashboard-exposure-body"></div>
      </div>

      <div class="dashboard-card dashboard-signals-card dashboard-bottom-secondary">
        <div class="dashboard-card-head">
          <h3>最新信号</h3>
          <span class="dashboard-card-sub" id="dashboard-signals-count">—</span>
        </div>
        <div class="dashboard-signals-body" id="dashboard-signals-list"></div>
      </div>

      <div class="dashboard-card dashboard-leaderboard-card dashboard-bottom-secondary">
        <div class="dashboard-card-head">
          <h3>策略卡</h3>
          <span class="dashboard-card-sub">登记策略</span>
        </div>
        <div class="dashboard-leaderboard-body" id="dashboard-leaderboard"></div>
      </div>
    </div>
  </section>

</div>
