<aside class="ai-drawer" id="ai-drawer" aria-hidden="true" aria-label="AI 命令">
  <div class="ai-drawer-backdrop" id="ai-drawer-backdrop" tabindex="-1"></div>
  <div class="ai-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="ai-drawer-title">
    <header class="ai-drawer-head">
      <div>
        <h2 id="ai-drawer-title">AI 命令</h2>
        <p class="ai-drawer-ctx" id="ai-drawer-ctx">自然语言驱动量化系统</p>
      </div>
      <div class="ai-drawer-head-actions">
        <button type="button" class="icon-btn" id="ai-drawer-close" aria-label="关闭">×</button>
      </div>
    </header>
    <div class="ai-drawer-chips" id="ai-drawer-chips">
      <button type="button" data-ai-q="请基于模拟账户 paper.json 持仓给我分析与调仓建议">持仓</button>
      <button type="button" data-ai-q="今天盘前市场上下文怎样？跨市场、情绪周期、监管 prior 是否激活？">盘前环境</button>
      <button type="button" data-ai-q="对模拟持仓做T回测30日">做T回测</button>
      <button type="button" data-ai-q="__current_quote__">当前行情</button>
    </div>
    <div class="ai-drawer-market" id="ai-drawer-market" aria-live="polite" hidden></div>
    <div class="ai-drawer-messages" id="ai-drawer-messages" aria-live="polite"></div>
    <form class="ai-drawer-form" id="ai-drawer-form" autocomplete="off">
      <label class="sr-only" for="ai-drawer-input">命令</label>
      <textarea id="ai-drawer-input" rows="2" placeholder="用自然语言下命令…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button type="submit" class="dialog-btn" id="ai-drawer-send">发送</button>
    </form>
    <p class="ai-drawer-hint">Esc 关闭 · ⌘K / Ctrl+K 打开 · 危险动作仍需人审确认</p>
  </div>
</aside>
