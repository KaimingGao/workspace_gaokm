<dialog id="evals-dialog">
    <form method="dialog" class="dialog-panel evals-panel">
{{EVALS_PANEL}}
      <div class="evals-actions">
        <button value="ok" class="dialog-btn">关闭</button>
      </div>
    </form>
  </dialog>

  <dialog id="usage-dialog">
    <form method="dialog" class="dialog-panel">
{{USAGE_PANEL}}
      <button value="ok" class="dialog-btn">关闭</button>
    </form>
  </dialog>

  <dialog id="readme-dialog">
    <form method="dialog" class="dialog-panel readme-panel">
      <div class="readme-head">
        <h2 id="readme-title">子目录 README</h2>
        <p id="readme-meta" class="sub"></p>
      </div>
      <div id="readme-doc-links" class="readme-doc-links"></div>
      <article id="readme-body" class="readme-body sub">加载中…</article>
      <button value="ok" class="dialog-btn">关闭</button>
    </form>
  </dialog>
