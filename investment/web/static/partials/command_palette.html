<div id="command-palette" class="command-palette" hidden aria-hidden="true">
  <div class="command-palette-backdrop" id="command-palette-backdrop"></div>
  <div
    class="command-palette-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="command-palette-title"
  >
    <h2 id="command-palette-title" class="sr-only">命令面板</h2>
    <input
      type="search"
      id="command-palette-input"
      class="command-palette-input"
      placeholder="跳转页面或运行命令…（⌘⇧K）"
      autocomplete="off"
      spellcheck="false"
    />
    <ul id="command-palette-list" class="command-palette-list" role="listbox"></ul>
    <p class="command-palette-hint">↑↓ 选择 · Enter 执行 · Esc 关闭 · ⌘K 打开 AI</p>
  </div>
</div>
