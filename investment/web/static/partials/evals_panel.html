      <div class="evals-head">
        <h2>黄金用例校验</h2>
        <p id="evals-meta" class="evals-meta">Skills checklist · 可选 Agent 对照</p>
      </div>
      <div class="evals-options">
        <label class="evals-check"><input type="checkbox" id="evals-mock" checked /> 离线 mock</label>
        <label class="evals-check"><input type="checkbox" id="evals-presets" checked /> preset 校验</label>
        <label class="evals-check"><input type="checkbox" id="evals-agent" /> Agent 对照（较慢，需 LLM）</label>
        <label class="evals-select-wrap">
          用例
          <select id="evals-case">
            <option value="">全部</option>
          </select>
        </label>
      </div>
      <div id="evals-summary" class="evals-summary"></div>
      <details id="evals-routing-wrap" class="evals-routing-wrap">
        <summary>路由对照表</summary>
        <p id="evals-routing-meta" class="evals-meta">展开后加载 golden routing 预期</p>
        <div id="evals-routing-table" class="evals-routing-table"></div>
      </details>
      <details id="evals-readme-wrap" class="evals-readme-wrap">
        <summary>子目录 README</summary>
        <p id="evals-readme-meta" class="evals-meta">展开后加载 README 覆盖与目录树</p>
        <div id="evals-readme-tree" class="quant-package-tree"></div>
      </details>
      <ul id="evals-list" class="evals-list"></ul>
      <div class="evals-actions">
        <button type="button" id="evals-routing-refresh" class="dialog-btn secondary">刷新路由表</button>
        <button type="button" id="evals-run" class="dialog-btn secondary">运行</button>
        <button type="button" id="evals-ci" class="dialog-btn secondary">CI 同款</button>
        <button type="button" id="evals-ci-quant" class="dialog-btn secondary">量化 CI 同款</button>
        <button type="button" id="evals-presets-run" class="dialog-btn secondary">preset 校验</button>
        <button type="button" id="evals-readme-run" class="dialog-btn secondary">README 覆盖</button>
        <button type="button" id="evals-daily" class="dialog-btn secondary">每日 eval</button>
        <button type="button" id="evals-last" class="dialog-btn secondary">上次结果</button>
        <button type="button" id="evals-download" class="dialog-btn secondary">下载 JSON</button>
      </div>
